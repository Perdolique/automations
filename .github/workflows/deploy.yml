name: Reusable Deploy Workflow

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      working-directory:
        description: Working directory for the project
        required: false
        default: '.'
        type: string
      artifact-path:
        description: Path to the build output directory
        required: false
        default: '.output'
        type: string
      artifact-name:
        description: Name of the deployment artifact
        required: false
        default: 'deployment-artifact'
        type: string
      build-command:
        description: pnpm script name for building the project
        required: false
        default: 'build'
        type: string
      test-typecheck-command:
        description: pnpm script name for type checking (optional, skipped if empty)
        required: false
        default: ''
        type: string
      lint-markdown-command:
        description: pnpm script name for markdown linting (optional, skipped if empty)
        required: false
        default: ''
        type: string
      lint-oxlint-command:
        description: pnpm script name for oxlint (optional, skipped if empty)
        required: false
        default: ''
        type: string
      test-unit-command:
        description: pnpm script name for unit tests (optional, skipped if empty)
        required: false
        default: ''
        type: string
      test-e2e-command:
        description: pnpm script name for end-to-end tests (optional, skipped if empty)
        required: false
        default: ''
        type: string
      playwright-browsers:
        description: Space-separated Playwright browsers to install before end-to-end tests
        required: false
        default: ''
        type: string
      deploy-to-staging-command:
        description: pnpm script name for deploying to staging
        required: false
        default: 'deploy:versions:staging'
        type: string
      deploy-to-production-command:
        description: pnpm script name for deploying to production
        required: false
        default: 'deploy:production'
        type: string
    secrets:
      cloudflare-account-id:
        description: Cloudflare account ID
        required: true
      cloudflare-api-token:
        description: Cloudflare API token
        required: true

concurrency:
  group: ${{ inputs.artifact-name }}-${{ inputs.working-directory }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Check Typescript types correctness
  test-typecheck:
    if: inputs.test-typecheck-command != ''
    name: Typecheck
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v3
        with:
          install-dependencies: true
      - name: Run typecheck
        run: |
          pnpm ${{ inputs.test-typecheck-command }}

  lint-markdown:
    if: inputs.lint-markdown-command != ''
    name: Markdown lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v3
        with:
          install-dependencies: true
      - name: Run markdown lint
        run: |
          pnpm run ${{ inputs.lint-markdown-command }}

  lint-oxlint:
    if: inputs.lint-oxlint-command != ''
    name: Oxlint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v3
        with:
          install-dependencies: true
      - name: Run lint
        run: |
          pnpm run ${{ inputs.lint-oxlint-command }}

  test-unit:
    if: inputs.test-unit-command != ''
    name: Unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v3
        with:
          install-dependencies: true
      - name: Run unit tests
        run: |
          pnpm run ${{ inputs.test-unit-command }}

  test-e2e:
    if: inputs.test-e2e-command != ''
    name: End-to-end tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v3
        with:
          install-dependencies: true
      - name: Install Playwright browsers
        if: inputs.playwright-browsers != ''
        run: |
          pnpm exec playwright install --with-deps ${{ inputs.playwright-browsers }}
      - name: Run end-to-end tests
        run: |
          pnpm run ${{ inputs.test-e2e-command }}

  # Build the project and upload artifact
  build:
    name: Build artifact
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v3
        with:
          install-dependencies: true
      - name: Build project
        run: |
          pnpm run ${{ inputs.build-command }}
      - name: Upload build artifact
        id: upload-artifact
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          if-no-files-found: error
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory == '.' && inputs.artifact-path || format('{0}/{1}', inputs.working-directory, inputs.artifact-path) }}

  deploy:
    if: |
      always() &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'push' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        )
      ) &&
      needs.build.result == 'success' &&
      (needs.test-typecheck.result == 'success' || needs.test-typecheck.result == 'skipped') &&
      (needs.lint-markdown.result == 'success' || needs.lint-markdown.result == 'skipped') &&
      (needs.lint-oxlint.result == 'success' || needs.lint-oxlint.result == 'skipped') &&
      (needs.test-unit.result == 'success' || needs.test-unit.result == 'skipped') &&
      (needs.test-e2e.result == 'success' || needs.test-e2e.result == 'skipped')
    name: Deploy to ${{ github.event_name == 'pull_request' && 'staging' || 'production' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    needs:
      - build
      - test-typecheck
      - lint-markdown
      - lint-oxlint
      - test-unit
      - test-e2e
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # Setup pnpm and download artifact
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v3
        with:
          install-dependencies: true
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory == '.' && inputs.artifact-path || format('{0}/{1}', inputs.working-directory, inputs.artifact-path) }}

      # Set wrangler log file path for capturing output
      - name: Set wrangler output file path
        id: set-wrangler-log
        run: |
          WRANGLER_LOG=/tmp/wrangler-$(date '+%s%N').log
          echo "wrangler-log=$WRANGLER_LOG" >> $GITHUB_OUTPUT

      # Deploy to Cloudflare Workers
      - name: Deploy to ${{ github.event_name == 'pull_request' && 'staging' || 'production' }}
        id: deploy
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cloudflare-account-id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
          PRODUCTION_DEPLOY_COMMAND: ${{ inputs.deploy-to-production-command }}
          STAGING_DEPLOY_COMMAND: ${{ inputs.deploy-to-staging-command }}
        run: |
          export WRANGLER_OUTPUT_FILE_PATH=${{ steps.set-wrangler-log.outputs.wrangler-log }}

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            pnpm run "$STAGING_DEPLOY_COMMAND"
          else
            pnpm run "$PRODUCTION_DEPLOY_COMMAND"
          fi

      # Extract deployment URLs from wrangler log
      - name: Get deployment URLs
        id: get-deployment-urls
        continue-on-error: true
        run: |
          DEPLOYMENT_URLS=$(jq --raw-output --slurp '
            [
              .[] |
              .preview_url?,
              .targets[]?
            ] |
            map(select(type == "string" and length > 0)) |
            map(if startswith("http://") or startswith("https://") then . else "https://" + . end) |
            unique[]
          ' ${{ steps.set-wrangler-log.outputs.wrangler-log }})

          if [ -z "$DEPLOYMENT_URLS" ]; then
            echo "Error: No deployment URLs found in wrangler log"
            exit 1
          fi

          echo "deployment-urls<<EOF" >> $GITHUB_OUTPUT
          echo "$DEPLOYMENT_URLS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "deployment-links<<EOF" >> $GITHUB_OUTPUT
          while IFS= read -r url; do
            echo "  - $url" >> $GITHUB_OUTPUT
          done <<< "$DEPLOYMENT_URLS"
          echo "EOF" >> $GITHUB_OUTPUT

      # Create deployment summary
      - name: Create deployment summary
        if: always()
        env:
          DEPLOYMENT_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          DEPLOYMENT_HEADING: ${{ github.event_name == 'pull_request' && '🎭 Staging' || '🚀 Production' }}
          DEPLOYMENT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "## $DEPLOYMENT_HEADING Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ steps.deploy.outcome == 'success' && steps.get-deployment-urls.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`$DEPLOYMENT_SHA\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`$DEPLOYMENT_BRANCH\` |" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "| **PR** | [#$PR_NUMBER]($PR_URL) |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "| **Deployed by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ steps.deploy.outcome }}" == "success" && "${{ steps.get-deployment-urls.outcome }}" == "success" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔗 URLs" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            while IFS= read -r url; do
              echo "- $url" >> $GITHUB_STEP_SUMMARY
            done <<< "${{ steps.get-deployment-urls.outputs.deployment-urls }}"
          fi

      # Comment on the pull request with success status
      - name: Comment successful deployment URLs
        if: ${{ github.event_name == 'pull_request' && steps.deploy.outcome == 'success' && steps.get-deployment-urls.outcome == 'success' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          message: |
            ## 🎉 Deployed to Cloudflare!

            - Commit: `${{ github.event.pull_request.head.sha }}`
            - Deployment URLs:
            ${{ steps.get-deployment-urls.outputs.deployment-links }}

      # Comment on the pull request with failure status
      - name: Comment deployment failure
        if: ${{ github.event_name == 'pull_request' && (steps.deploy.outcome == 'failure' || steps.get-deployment-urls.outcome == 'failure') }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          message: |
            ## ❌ Deployment to Cloudflare failed!

            - Commit: `${{ github.event.pull_request.head.sha }}`
            - Please check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details.

      # Fail the workflow if deployment failed
      - name: Fail workflow if deployment failed
        if: ${{ steps.deploy.outcome == 'failure' || steps.get-deployment-urls.outcome == 'failure' }}
        env:
          DEPLOYMENT_TARGET: ${{ github.event_name == 'pull_request' && 'staging' || 'production' }}
        run: |
          echo "Deployment to $DEPLOYMENT_TARGET failed."
          exit 1
