name: Reusable Deploy Workflow

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      working-directory:
        description: Working directory for the project
        required: false
        default: '.'
        type: string
      artifact-path:
        description: Path to the build output directory
        required: false
        default: '.output'
        type: string
      artifact-name:
        description: Name of the deployment artifact
        required: false
        default: 'deployment-artifact'
        type: string
      build-command:
        description: pnpm script name for building the project
        required: false
        default: 'build'
        type: string
      test-typecheck-command:
        description: pnpm script name for type checking (optional, skipped if empty)
        required: false
        default: ''
        type: string
      lint-markdown-command:
        description: pnpm script name for markdown linting (optional, skipped if empty)
        required: false
        default: ''
        type: string
      lint-oxlint-command:
        description: pnpm script name for oxlint (optional, skipped if empty)
        required: false
        default: ''
        type: string
      test-unit-command:
        description: pnpm script name for unit tests (optional, skipped if empty)
        required: false
        default: ''
        type: string
      deploy-to-staging-command:
        description: pnpm script name for deploying to staging
        required: false
        default: 'deploy:versions:staging'
        type: string
      deploy-to-production-command:
        description: pnpm script name for deploying to production
        required: false
        default: 'deploy:production'
        type: string
    secrets:
      cloudflare-account-id:
        description: Cloudflare account ID
        required: true
      cloudflare-api-token:
        description: Cloudflare API token
        required: true

concurrency:
  group: ${{ inputs.artifact-name }}-${{ inputs.working-directory }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Check Typescript types correctness
  test-typecheck:
    if: inputs.test-typecheck-command != ''
    name: Typecheck
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v2
        with:
          install-dependencies: true
      - name: Run typecheck
        run: |
          pnpm ${{ inputs.test-typecheck-command }}

  lint-markdown:
    if: inputs.lint-markdown-command != ''
    name: Markdown lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v2
        with:
          install-dependencies: true
      - name: Run markdown lint
        run: |
          pnpm run ${{ inputs.lint-markdown-command }}

  lint-oxlint:
    if: inputs.lint-oxlint-command != ''
    name: Oxlint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v2
        with:
          install-dependencies: true
      - name: Run lint
        run: |
          pnpm run ${{ inputs.lint-oxlint-command }}

  test-unit:
    if: inputs.test-unit-command != ''
    name: Unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v2
        with:
          install-dependencies: true
      - name: Run unit tests
        run: |
          pnpm run ${{ inputs.test-unit-command }}

  # Build the project and upload artifact
  build:
    name: Build artifact
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v2
        with:
          install-dependencies: true
      - name: Build project
        run: |
          pnpm run ${{ inputs.build-command }}
      - name: Upload build artifact
        id: upload-artifact
        uses: actions/upload-artifact@v5
        with:
          include-hidden-files: true
          if-no-files-found: error
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory == '.' && inputs.artifact-path || format('{0}/{1}', inputs.working-directory, inputs.artifact-path) }}

  deploy-to-staging:
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.build.result == 'success' &&
      (needs.test-typecheck.result == 'success' || needs.test-typecheck.result == 'skipped') &&
      (needs.lint-markdown.result == 'success' || needs.lint-markdown.result == 'skipped') &&
      (needs.lint-oxlint.result == 'success' || needs.lint-oxlint.result == 'skipped') &&
      (needs.test-unit.result == 'success' || needs.test-unit.result == 'skipped')
    name: Deploy to staging
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    outputs:
      wrangler-log: ${{ steps.set-wrangler-log.outputs.wrangler-log }}
    needs:
      - build
      - test-typecheck
      - lint-markdown
      - lint-oxlint
      - test-unit
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # Setup pnpm and download artifact
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v2
        with:
          install-dependencies: true
      - name: Download build artifact
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory == '.' && inputs.artifact-path || format('{0}/{1}', inputs.working-directory, inputs.artifact-path) }}

      # Set wrangler log file path for capturing output
      - name: Set wrangler output file path
        id: set-wrangler-log
        run: |
          WRANGLER_LOG=/tmp/wrangler-$(date '+%s%N').log
          echo "wrangler-log=$WRANGLER_LOG" >> $GITHUB_OUTPUT

      # Deploy to Cloudflare Workers
      - name: Deploy version to staging
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cloudflare-account-id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
        run: |
          export WRANGLER_OUTPUT_FILE_PATH=${{ steps.set-wrangler-log.outputs.wrangler-log }}
          pnpm run ${{ inputs.deploy-to-staging-command }}

      # Extract deployment URL from wrangler log
      - name: Get deployment URL
        id: get-deployment-url
        continue-on-error: true
        run: |
          PREVIEW_URL=$(jq --raw-output --slurp 'first(.[] | select(.preview_url) | .preview_url)' ${{ steps.set-wrangler-log.outputs.wrangler-log }})

          if [ -z "$PREVIEW_URL" ]; then
            echo "Error: No preview_url found in wrangler log"
            exit 1
          fi

          echo "preview-url=$PREVIEW_URL" >> $GITHUB_OUTPUT

      # Create deployment summary
      - name: Create deployment summary
        if: always()
        run: |
          echo "## 🎭 Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ steps.get-deployment-url.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.event.pull_request.head.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.event.pull_request.head.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **PR** | [#${{ github.event.pull_request.number }}](${{ github.event.pull_request.html_url }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Preview URL** | ${{ steps.get-deployment-url.outcome == 'success' && steps.get-deployment-url.outputs.preview-url || 'Not available' }} |" >> $GITHUB_STEP_SUMMARY

      # Comment on the pull request with success status
      - name: Comment successful deployment URL
        if: ${{ steps.get-deployment-url.outcome == 'success' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ## 🎉 Deployed to Cloudflare!

            - Commit: `${{ github.event.pull_request.head.sha }}`
            - Preview URL: ${{ steps.get-deployment-url.outputs.preview-url }}

      # Comment on the pull request with failure status
      - name: Comment deployment failure
        if: ${{ steps.get-deployment-url.outcome == 'failure' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ## ❌ Deployment to Cloudflare failed!

            - Commit: `${{ github.event.pull_request.head.sha }}`
            - Please check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details.

      # Fail the workflow if deployment failed
      - name: Fail workflow if deployment failed
        if: ${{ steps.get-deployment-url.outcome == 'failure' }}
        run: |
          echo "Deployment to staging failed."
          exit 1

  deploy-to-production:
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.build.result == 'success' &&
      (needs.test-typecheck.result == 'success' || needs.test-typecheck.result == 'skipped') &&
      (needs.lint-markdown.result == 'success' || needs.lint-markdown.result == 'skipped') &&
      (needs.lint-oxlint.result == 'success' || needs.lint-oxlint.result == 'skipped') &&
      (needs.test-unit.result == 'success' || needs.test-unit.result == 'skipped')
    name: Deploy to production
    runs-on: ubuntu-24.04
    needs:
      - build
      - test-typecheck
      - lint-markdown
      - lint-oxlint
      - test-unit
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # Setup pnpm and download artifact
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v2
        with:
          install-dependencies: true
      - name: Download build artifact
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory == '.' && inputs.artifact-path || format('{0}/{1}', inputs.working-directory, inputs.artifact-path) }}

      # Set wrangler log file path for capturing output
      - name: Set wrangler output file path
        id: set-wrangler-log
        run: |
          WRANGLER_LOG=/tmp/wrangler-$(date '+%s%N').log
          echo "wrangler-log=$WRANGLER_LOG" >> $GITHUB_OUTPUT

      # Deploy to Cloudflare Workers
      - name: Deploy to production
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cloudflare-account-id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
        run: |
          export WRANGLER_OUTPUT_FILE_PATH=${{ steps.set-wrangler-log.outputs.wrangler-log }}
          pnpm run ${{ inputs.deploy-to-production-command }}

      # Extract deployment URL from wrangler log
      - name: Get deployment URLs
        id: get-deployment-urls
        continue-on-error: true
        run: |
          # Extract all targets from wrangler log as newline-separated list
          TARGETS=$(jq --raw-output --slurp 'first(.[] | select(.targets)) | .targets[]' ${{ steps.set-wrangler-log.outputs.wrangler-log }})

          if [ -z "$TARGETS" ]; then
            echo "Error: No production URLs found in wrangler log"
            exit 1
          fi

          # Process each target: add https:// prefix if needed
          URLS=""
          while IFS= read -r target; do
            if [ -z "$target" ]; then continue; fi
            if [[ "$target" != https://* ]]; then
              URLS+="https://$target"$'\n'
            else
              URLS+="$target"$'\n'
            fi
          done <<< "$TARGETS"

          echo "production-urls<<EOF" >> $GITHUB_OUTPUT
          echo -n "$URLS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Create deployment summary
      - name: Create deployment summary
        if: always()
        run: |
          echo "## 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ steps.get-deployment-urls.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ steps.get-deployment-urls.outcome }}" == "success" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔗 URLs" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            while IFS= read -r url; do
              if [ -z "$url" ]; then continue; fi
              echo "- $url" >> $GITHUB_STEP_SUMMARY
            done <<< "${{ steps.get-deployment-urls.outputs.production-urls }}"
          fi

      # Fail the workflow if deployment failed
      - name: Fail workflow if deployment failed
        if: ${{ steps.get-deployment-urls.outcome == 'failure' }}
        run: |
          echo "Deployment to production failed."
          exit 1
