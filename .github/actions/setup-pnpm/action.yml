name: Setup pnpm and install dependencies composite action
description: Sets up pnpm, Node.js environment, and optionally installs project dependencies

inputs:
  ref:
    description: Branch, tag, or SHA to checkout
    required: false
    default: ''

  install-dependencies:
    description: Whether to install dependencies
    required: false
    default: 'false'

  cache:
    description: Whether to cache the pnpm store directory
    required: false
    default: 'true'

  working-directory:
    description: Project directory containing package.json and pnpm-lock.yaml, relative to the repository root
    required: false
    default: '.'

  registry-url:
    description: Optional registry to configure for authentication
    required: false

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        registry-url: ${{ inputs.registry-url }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        cache: ${{ inputs.cache }}
        package_json_file: ${{ inputs.working-directory }}/package.json
        cache_dependency_path: ${{ inputs.working-directory }}/pnpm-lock.yaml

    - name: Install dependencies
      if: ${{ inputs.install-dependencies == 'true' }}
      run: |
        pnpm install --frozen-lockfile
      shell: bash
      working-directory: ${{ inputs.working-directory }}
